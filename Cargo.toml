[package]
name = "mudel-ai-connect-server"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[[bin]]
name = "mudel-ai-connect-server"
path = "src/main.rs"

[[bin]]
name = "mudel-ai-connect-setup"
path = "src/setup.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:eframe", "dep:rfd", "dep:sysinfo", "dep:toml_edit", "dep:sha2"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
rpassword = "7.5"
percent-encoding = "2"
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "form"] }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
tempfile = "3.27"
unicode-normalization = "0.1"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow"], optional = true }
rfd = { version = "0.15", default-features = false, optional = true }
sysinfo = { version = "0.37", default-features = false, features = ["system"], optional = true }
toml_edit = { version = "0.25", optional = true }
sha2 = { version = "0.10", optional = true }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
base64 = "0.23"
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
