[package]
name = "mudel-ai-connect-server"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
rpassword = "7.5"
percent-encoding = "2"
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "form"] }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.27"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
base64 = "0.23"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[profile.release]
lto = "thin"
strip = true
