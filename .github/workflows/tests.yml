name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r local/requirements.txt
      - name: Ejecutar pruebas
        run: python run_tests.py -v
      - name: Comprobar el paquete del plugin
        run: python local/scripts/build_plugin.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Comprobar formato Rust
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Comprobar código Rust
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets --features desktop -- -D warnings
      - name: Compilar y probar Rust
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked
          cargo test --manifest-path rust/Cargo.toml --locked --features desktop
      - name: Comprobar contrato Python y proceso MCP Rust
        run: |
          python -m pip install -r local/requirements.txt
          python rust/tests/test_contract.py
      - name: Generar y comprobar instalador y plugin nativos
        shell: pwsh
        run: |
          ./rust/scripts/package.ps1
          python rust/tests/test_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: mudel-native-${{ matrix.os }}
          path: dist/native/
          if-no-files-found: error
          retention-days: 14
