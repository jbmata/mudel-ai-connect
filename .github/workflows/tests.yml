name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Comprobar formato
        run: cargo fmt -- --check
      - name: Comprobar código
        run: cargo clippy --locked --all-targets --features desktop -- -D warnings
      - name: Compilar y probar
        run: |
          cargo build --locked
          cargo test --locked --features desktop
      - name: Generar y comprobar instalador y plugin nativos
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mudel-native-${{ matrix.os }}
          path: dist/native/
          if-no-files-found: error
          retention-days: 14
